name: conformance

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/cs.mjs
      - run: node conformance/run.mjs
      - name: the skills installer finds the skill
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          out=$(NO_COLOR=1 npx -y skills add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "$out"
          echo "$out" | grep -F "Found 1 skill"
